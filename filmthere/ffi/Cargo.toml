[package]
name = "loki-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C ABI over the FilmCraft engine for the FilmThere Kotlin Multiplatform front end"

[lib]
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
filmcraft-engine = { path = "../../crates/engine" }
filmcraft-render = { path = "../../crates/render" }
filmcraft-project = { path = "../../crates/project" }
serde_json = "1"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"
